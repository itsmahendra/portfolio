<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 400px;
      color: #fff;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .login-card h2 { text-align: center; margin-bottom: 20px; }
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: #cbd5e1; }
    .input-group input {
      width: 100%; padding: 12px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff; outline: none; font-size: 0.95rem;
    }
    .input-group input:focus { border-color: #6366f1; }
    .btn-submit {
      width: 100%; padding: 12px; border-radius: 10px; border: none;
      background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; font-weight: 600; cursor: pointer;
      margin-top: 10px;
    }
    .toggle-text { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
    .toggle-text a { color: #a855f7; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2 id="title">Welcome Back</h2>
    <form onsubmit="alert('Demo Login Successful!'); return false;">
      <div class="input-group">
        <label>Email Address</label>
        <input type="email" placeholder="mahendra@example.com" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <div class="toggle-text">
      Don't have an account? <a href="#" onclick="alert('Sign up form toggle demo'); return false;">Sign Up</a>
    </div>
  </div>
</body>
</html>
