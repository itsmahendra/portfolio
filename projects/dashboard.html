<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 30px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 2rem; color: #38bdf8; }
    .app-container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 15px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    .input-row input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; outline: none; }
    .input-row button { background: #38bdf8; color: #0f172a; font-weight: 600; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; }
    .task-list { list-style: none; }
    .task-item { background: #334155; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .task-item.completed span { text-decoration: line-through; color: #94a3b8; }
    .btn-delete { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Interactive Task Dashboard</h1>
    <p>Keep track of your daily tasks in real-time.</p>
  </div>
  <div class="app-container">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new project task...">
      <button onclick="addTask()">Add Task</button>
    </div>
    <ul class="task-list" id="taskList">
      <div class="task-item">
        <span>Build Portfolio Website</span>
        <button class="btn-delete" onclick="this.parentElement.remove()">Delete</button>
      </div>
      <div class="task-item">
        <span>Review Modern UI Designs</span>
        <button class="btn-delete" onclick="this.parentElement.remove()">Delete</button>
      </div>
    </ul>
  </div>
  <script>
    function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      const li = document.createElement('div');
      li.className = 'task-item';
      li.innerHTML = `<span>${input.value}</span><button class="btn-delete" onclick="this.parentElement.remove()">Delete</button>`;
      document.getElementById('taskList').appendChild(li);
      input.value = '';
    }
  </script>
</body>
</html>
