<!DOCTYPE html>
<html>
<head>
<title>Quiz App</title>

<style>
body {
  background: #0a0a0a;
  color: white;
  font-family: Arial;
  text-align: center;
}

.container {
  margin-top: 50px;
}

h1 {
  color: #c084fc;
}

button {
  display: block;
  margin: 10px auto;
  padding: 10px;
  width: 260px;
  background: #1a001f;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 6px;
  transition: 0.3s;
}

button:hover {
  background: #c084fc;
  color: black;
}

#feedback {
  margin-top: 10px;
  font-weight: bold;
}

#nextBtn {
  margin-top: 20px;
  background: #c084fc;
  color: black;
}
</style>

</head>
<body>

<div class="container">
  <h1>Quiz App</h1>

  <h2 id="question"></h2>
  <div id="options"></div>

  <p id="feedback"></p>
  <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next</button>
</div>

<script>
const quiz = [
  {
    q: "HTML stands for?",
    options: ["Hyper Text Markup Language", "Home Tool Markup", "Hyperlinks Text"],
    answer: 0
  },
  {
    q: "CSS is used for?",
    options: ["Structure", "Styling", "Database"],
    answer: 1
  },
  {
    q: "JavaScript is?",
    options: ["Programming Language", "Database", "Styling Tool"],
    answer: 0
  },
   {
  q: "Which tag is used to insert an image in HTML?",
  options: ["&lt;img&gt;", "&lt;image&gt;", "&lt;pic&gt;"],
  answer: 0
},
  {
    q: "Which is correct syntax?",
    options: ["let x = 5", "var = x", "x == let"],
    answer: 0
  }
];

let index = 0;
let score = 0;
let wrong = 0;

function loadQuestion() {
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  let q = quiz[index];
  document.getElementById("question").innerText = q.q;

  let optionsHtml = "";
  q.options.forEach((opt, i) => {
    optionsHtml += `<button onclick="checkAnswer(${i})">${opt}</button>`;
  });

  document.getElementById("options").innerHTML = optionsHtml;
}

function checkAnswer(i) {
  let correct = quiz[index].answer;

  if(i === correct) {
    score++;
    document.getElementById("feedback").innerText = "✅ Correct!";
  } else {
    wrong++;
    document.getElementById("feedback").innerText = "❌ Wrong!";
  }

  document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
  index++;

  if(index < quiz.length) {
    loadQuestion();
  } else {
    document.body.innerHTML = `
      <h1>Quiz Finished 🎉</h1>
      <h2>Total Questions: ${quiz.length}</h2>
      <h2>✅ Correct: ${score}</h2>
      <h2>❌ Wrong: ${wrong}</h2>
      <button onclick="location.reload()">Restart</button>
    `;
  }
}

loadQuestion();
</script>

</body>
</html>
